services:
  - type: web
    name: vantage-capital
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/vantage.db
    disk:
      name: vantage-data
      mountPath: /var/data
      sizeGB: 1
