services:
  - type: web
    name: vantage-capital
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node --experimental-sqlite server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCOUNT_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SANDBOX_MODE
        value: "true"
